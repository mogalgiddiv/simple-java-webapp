name: Trigger Jenkins Pipeline

on:
  push:
   branches:
     - main

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Pipeline
        run: |
          curl -X POST http://localhost:8080/job/tomcat-deploy-pipeline/build \
          --user ${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}
